# 最小门槛：类型、静态检查、构建、单测。
# 不跑 deploy:dry-run：那要再多等一轮 wrangler，这套是给每次推送用的。
#
# ffmpeg 是 HLS 用例的测试音频来源（tests/fixture-audio.ts）。装它有两个作用：
# 让需要真实 MP3 的用例真的跑起来，并且让 `ffmpeg -version` 这一步成为硬门槛——
# 哪天镜像变了、ffmpeg 没了，用例会静默变成 skip，这里要当场红，不能是假的绿。
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moting-reader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moting-reader/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 测试音频需要的 ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: 类型检查
        run: npm run typecheck

      - name: 静态检查
        run: npm run lint

      # tests/worker-ai.test.mjs 直接 import dist/server/index.js：先构建，
      # 否则跑的是仓库里上一次留下的产物，绿得不明不白。
      - name: 构建
        run: npm run build

      - name: 单元测试
        run: node --experimental-strip-types --test tests/*.test.*
