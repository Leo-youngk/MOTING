<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>后台听书测试</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f7fb; --card: #fff; --ink: #1f2a44; --muted: #7a8499; --accent: #e8768f; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12151c; --card: #1c2029; --ink: #e6e9f0; --muted: #8b93a5; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  section { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  label { display: block; margin: 8px 0 4px; color: var(--muted); font-size: 13px; }
  select, button { font: inherit; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #8883; background: var(--card); color: var(--ink); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1f2a44; font-weight: 600; }
  audio { width: 100%; margin-top: 10px; }
  #caps, #status { font-size: 13px; white-space: pre-wrap; }
  #log { font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 50vh; overflow: auto; }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<p style="margin:0"><a href="/" style="color:var(--accent)">‹ 回到墨听</a></p>
<h1>后台听书测试</h1>
<p>先登录云端同步，选择书和章节，点击开始即可播放。默认快速首播模式会在选择后上传本次测试的文字并预热首句；后续音频由服务端连续生成。仅测试从章首开始的播放，不修改正式听书进度。流式测试暂不支持拖动定位；请锁屏或切换应用，不要从任务列表强制关闭。</p>

<section>
  <div id="caps">检测中…</div>
</section>

<section>
  <label for="book">书</label>
  <select id="book"><option value="">（读取书库中…）</option></select>
  <label for="chapter">从哪一章开始</label>
  <select id="chapter"></select>
  <label for="mode">播放方式</label>
  <select id="mode">
    <option value="stream" selected>快速首播：原生音频流，服务端连续生成</option>
    <option value="hls">原生 HLS：准备完成后由 Safari 连续播放</option>
    <option value="mms">MMS 连续流：所有音频追加进同一个音频元素</option>
    <option value="swap">逐段换源：每段播完换地址再 play()（现在的做法）</option>
  </select>
  <label for="minutes">测试时长（快速模式最多约 2.2 万字，实际时长以内容为准）</label>
  <select id="minutes"><option value="10">10 分钟快速验证</option><option value="60" selected>60 分钟锁屏验证</option></select>
  <button id="hls-play" hidden>准备完成，点击播放</button>
  <label for="size">每段字数（越小交接越频繁，越容易暴露问题）</label>
  <select id="size">
    <option value="600" selected>600 字（约 2 分钟一段）</option>
    <option value="1500">1500 字（约 5 分钟一段）</option>
    <option value="4800">4800 字（跟正式播放器一样）</option>
  </select>
  <label for="ahead">提前缓冲（MMS）</label>
  <select id="ahead">
    <option value="240" selected>4 分钟</option>
    <option value="1800">30 分钟（后台脚本停住时也能多撑一会）</option>
  </select>
  <label for="rate">倍速</label>
  <select id="rate">
    <option value="1" selected>1.0×</option>
    <option value="1.25">1.25×</option>
    <option value="1.5">1.5×</option>
    <option value="2">2.0×</option>
  </select>
  <div class="row">
    <button id="start" class="primary">开始</button>
    <button id="toggle" disabled>暂停</button>
  </div>
  <audio id="audio" controls playsinline></audio>
</section>

<section>
  <div id="status">未开始</div>
</section>

<section>
  <div class="row" style="margin-top:0">
    <button id="copy">复制日志</button>
    <button id="clear">清空日志</button>
  </div>
  <div id="log"></div>
</section>

<script type="module">
import { continuousAhead, missingInterval, appendWithRecovery } from "/mms-probe-core.mjs";
// 验证 iOS 上后台连续听书：MMS 连续流 vs 逐段换源。日志存在 localStorage，锁屏一小时回来还在。
const LOG_KEY = "moting:mms-probe-log";
const LOG_LIMIT = 3000;
const VOICE = "zh-CN-YunjianNeural";

const $ = (id) => document.getElementById(id);
const audio = $("audio");
let entries = [];
try { entries = JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch { entries = []; }

function bufferedEnd() {
  const b = audio.buffered;
  return b && b.length ? b.end(b.length - 1) : 0;
}

function log(type, data) {
  const now = new Date();
  const entry = {
    t: now.toLocaleTimeString("zh-CN", { hour12: false }) + "." + String(now.getMilliseconds()).padStart(3, "0"),
    type,
    vis: document.visibilityState[0],
    ct: Math.round(audio.currentTime * 10) / 10,
    epoch: Date.now(),
    ahead: Math.round(continuousAhead(audio.buffered, audio.currentTime) * 10) / 10,
    buf: Math.round(bufferedEnd() * 10) / 10,
    paused: audio.paused,
    rs: audio.readyState,
    ...(data || {}),
  };
  entries.push(entry);
  if (entries.length > LOG_LIMIT) entries = entries.slice(-LOG_LIMIT);
  try { localStorage.setItem(LOG_KEY, JSON.stringify(entries)); } catch { /* 满了就只留在内存里 */ }
  renderLog();
}

function formatEntry(e) {
  const { t, type, vis, ct, buf, paused, rs, ...rest } = e;
  const extra = Object.keys(rest).length ? " " + JSON.stringify(rest) : "";
  return `${t} [${vis}] ${type} ct=${ct} buf=${buf}${paused ? " paused" : ""} rs=${rs}${extra}`;
}

let renderQueued = false;
function renderLog() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const bad = /error|stalled|fail|reject|quota|not-ready|evict/;
    $("log").innerHTML = entries.slice(-300).reverse()
      .map((e) => `<div${bad.test(e.type) ? ' class="bad"' : ""}>${formatEntry(e).replace(/</g, "&lt;")}</div>`)
      .join("");
  });
}

// ---------- 能力检测 ----------
const MMS = window.ManagedMediaSource;
const MS = window.MediaSource;
const Source = MMS || MS;
const caps = [
  `测试版本: 2026-09-27-stream-v1`,
  `UA: ${navigator.userAgent}`,
  `独立模式（主屏幕打开）: ${matchMedia("(display-mode: standalone)").matches}`,
  `原生 HLS: ${audio.canPlayType("application/vnd.apple.mpegurl") || "不支持"}`,
  `ManagedMediaSource: ${!!MMS}`,
  `MediaSource: ${!!MS}`,
  `audio/mpeg: ${Source ? Source.isTypeSupported("audio/mpeg") : "—"}`,
  `audio/mp4 AAC: ${Source ? Source.isTypeSupported('audio/mp4; codecs="mp4a.40.2"') : "—"}`,
];
$("caps").textContent = caps.join("\n");
if (!Source || !Source.isTypeSupported("audio/mpeg")) $("caps").classList.add("bad");

// ---------- 读书库 ----------
let books = [];
let chapters = [];

async function openLibrary() {
  // 书库不存在时别用 open() 顺手建一个空库：正式应用升级时会当成旧库去迁移。
  if (indexedDB.databases) {
    const list = await indexedDB.databases();
    if (!list.some((d) => d.name === "moting-reader")) return null;
  }
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("moting-reader");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function readAll(db, store) {
  return new Promise((resolve, reject) => {
    const request = db.transaction(store).objectStore(store).getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function readOne(db, store, key) {
  return new Promise((resolve, reject) => {
    const request = db.transaction(store).objectStore(store).get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

let db = null;
(async () => {
  try {
    db = await openLibrary();
    books = db && db.objectStoreNames.contains("books") ? await readAll(db, "books") : [];
    // 默认选最近在读的那本，从读到的那一章开始。
    books.sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0));
  } catch (error) {
    log("library-error", { message: String(error) });
  }
  const select = $("book");
  select.innerHTML = books.length
    ? books.map((b) => `<option value="${b.id}">${b.title}</option>`).join("")
    : '<option value="">书库是空的：先在墨听里导入一本书</option>';
  if (books.length) await loadChapters();
})();

async function loadChapters() {
  const content = db ? await readOne(db, "contents", $("book").value) : null;
  chapters = content ? content.chapters : [];
  $("chapter").innerHTML = chapters
    .map((c, i) => `<option value="${i}">${c.title || "第 " + (i + 1) + " 章"}</option>`)
    .join("");
  const book = books.find((b) => b.id === $("book").value);
  const position = book && (book.listeningPosition || book.readingPosition);
  if (position && position.chapterIndex < chapters.length) $("chapter").value = String(position.chapterIndex);
  await prepareStreamSession();
}
$("book").addEventListener("change", loadChapters);

/** 从某一章起按句子凑成每段不超过 size 字的朗读文本，章名单独起头。 */
function* segmentsFrom(startChapter, size) {
  for (let c = startChapter; c < chapters.length; c++) {
    const chapter = chapters[c];
    let text = chapter.title ? chapter.title + "。" : "";
    for (const paragraph of chapter.paragraphs || []) {
      if (paragraph.kind === "image") continue;
      for (const sentence of paragraph.sentences || []) {
        const piece = (sentence.speakableText || sentence.text || "").trim();
        if (!piece) continue;
        if (text && text.length + piece.length > size) {
          yield { chapter: c, text };
          text = "";
        }
        text += piece;
      }
    }
    if (text) yield { chapter: c, text };
  }
}

// ---------- 取音频 ----------
async function fetchClip(segment, index) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    const started = performance.now();
    try {
      const response = await fetch("/api/tts", {
        method: "POST",
        signal: AbortSignal.timeout(60000),
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text: segment.text, voice: VOICE }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const body = new Uint8Array(await response.arrayBuffer());
      if (body.length < 4) throw new Error("音频响应过短");
      const metaLength = new DataView(body.buffer).getUint32(0);
      if (4 + metaLength >= body.length) throw new Error("音频响应格式错误");
      const clip = body.slice(4 + metaLength);
      log("fetch-ok", { seg: index, ch: segment.chapter, chars: segment.text.length, kb: Math.round(clip.length / 1024), ms: Math.round(performance.now() - started) });
      return clip;
    } catch (error) {
      log("fetch-fail", { seg: index, attempt, message: String(error), ms: Math.round(performance.now() - started) });
      await new Promise((r) => setTimeout(r, 1500 * attempt));
    }
  }
  throw new Error("取音频连续失败");
}

// ---------- 共用：音频事件 ----------
for (const type of ["play", "playing", "pause", "waiting", "stalled", "ended", "emptied", "ratechange"]) {
  audio.addEventListener(type, () => log(type));
}
audio.addEventListener("error", () => log("audio-error", { code: audio.error && audio.error.code, message: audio.error && audio.error.message }));
let lastTimeLog = 0;
audio.addEventListener("timeupdate", () => {
  if (audio.currentTime - lastTimeLog >= 60 || audio.currentTime < lastTimeLog) {
    lastTimeLog = audio.currentTime;
    log("progress");
  }
});
document.addEventListener("visibilitychange", () => log("visibility"));
window.addEventListener("pagehide", () => log("pagehide"));
window.addEventListener("pageshow", (e) => log("pageshow", { persisted: e.persisted }));
document.addEventListener("freeze", () => log("freeze"));
document.addEventListener("resume", () => log("resume"));
// 定时器在后台会被节流甚至停掉，心跳之间的空档本身就是要看的信息。
setInterval(() => { if (running) log("heartbeat"); }, 30000);

let running = false;
let segmentIndex = 0;
let playedSegments = 0;
let startedAt = 0;

function updateStatus(extra) {
  if (["hls", "stream"].includes($("mode").value)) return;
  $("status").textContent = [
    `方式：${$("mode").value === "mms" ? "MMS 连续流" : "逐段换源"}`,
    `已开始 ${Math.round((Date.now() - startedAt) / 60000)} 分钟，播放位置 ${Math.round(audio.currentTime / 60)} 分钟`,
    `已缓冲到 ${Math.round(bufferedEnd() / 60)} 分钟；已取 ${segmentIndex} 段`,
    extra || "",
  ].join("\n");
}
setInterval(() => { if (running) updateStatus(); }, 1000);

function setupMediaSession(title) {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title, artist: "墨听 · 后台听书测试" });
  navigator.mediaSession.setActionHandler("play", () => { log("session-play"); audio.play().catch((e) => log("play-reject", { message: String(e) })); });
  navigator.mediaSession.setActionHandler("pause", () => { log("session-pause"); audio.pause(); });
}

// ---------- 方式一：MMS 连续流 ----------
async function runMms(segments) {
  const source = new Source();
  let wakeUp = null;
  function wake() { const resolve = wakeUp; wakeUp = null; if (resolve) resolve(); }
  const waitForNeed = () => new Promise((resolve) => {
    const timer = setTimeout(done, 1000);
    function done() { clearTimeout(timer); if (wakeUp === done) wakeUp = null; resolve(); }
    wakeUp = done;
  });
  source.addEventListener("startstreaming", () => { log("startstreaming"); wake(); });
  source.addEventListener("endstreaming", () => log("endstreaming"));
  source.addEventListener("sourceclose", () => { log("sourceclose"); wake(); });
  audio.addEventListener("timeupdate", wake);
  document.addEventListener("visibilitychange", wake);
  const opened = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error("MMS sourceopen 超时")), 15000);
    source.addEventListener("sourceopen", () => { clearTimeout(timer); resolve(); }, { once: true });
  });
  audio.disableRemotePlayback = true;
  const sourceUrl = URL.createObjectURL(source);
  audio.src = sourceUrl;
  audio.playbackRate = Number($("rate").value);
  audio.play().then(() => log("play-ok")).catch((e) => log("play-reject", { message: String(e) }));
  await opened;
  log("sourceopen", { managed: !!MMS });
  const buffer = source.addSourceBuffer("audio/mpeg");
  buffer.mode = "sequence";
  const ledger = []; // 保存未播完的原始分段，以原时间戳补回被系统回收的区间。
  let tail = 0;
  let aheadCap = Number($("ahead").value);
  let evicted = false;
  buffer.addEventListener("bufferedchange", (e) => {
    if (e.removedRanges && e.removedRanges.length) {
      evicted = true;
      log("evicted", { ranges: Array.from({length:e.removedRanges.length}, (_,i) => [e.removedRanges.start(i),e.removedRanges.end(i)]) });
      wake();
    }
  });
  const update = (operation) => new Promise((resolve, reject) => {
    const cleanup = () => { clearTimeout(timer); buffer.removeEventListener("updateend", done); buffer.removeEventListener("error", fail); source.removeEventListener("sourceclose", fail); };
    const done = () => { cleanup(); resolve(); };
    const fail = () => { cleanup(); reject(new Error("SourceBuffer 更新失败或超时")); };
    const timer = setTimeout(fail, 15000);
    buffer.addEventListener("updateend", done, { once: true });
    buffer.addEventListener("error", fail, { once: true });
    source.addEventListener("sourceclose", fail, { once: true });
    try { operation(); } catch (e) { cleanup(); reject(e); }
  });
  const trimPlayed = async (aggressive = false) => {
    const cut = audio.currentTime - (aggressive ? 2 : 60);
    if (cut > 0 && buffer.buffered.length && buffer.buffered.start(0) < cut) await update(() => buffer.remove(0, cut));
    while (ledger.length && ledger[0].end < audio.currentTime - 60) ledger.shift();
  };
  const append = async (bytes, start) => {
    buffer.timestampOffset = start;
    await appendWithRecovery(bytes, {
      append: part => update(() => buffer.appendBuffer(part)),
      trim: () => trimPlayed(true),
      wait: waitForNeed,
      alive: () => running && source.readyState === "open",
      onQuota: size => {
        aheadCap = Math.max(15, Math.min(aheadCap, continuousAhead(audio.buffered, audio.currentTime) / audio.playbackRate));
        log("quota", { chunkBytes:size, aheadCap });
      },
    });
  };
  const repair = async () => {
    evicted = false;
    for (const item of ledger) {
      if (!missingInterval(audio.buffered, Math.max(item.start, audio.currentTime), item.end)) continue;
      await append(item.bytes, item.start);
      if (missingInterval(audio.buffered, Math.max(item.start, audio.currentTime), item.end)) {
        throw new Error("回收的音频无法完整补回；请降低提前缓冲量后重试");
      }
      log("repaired", { seg:item.index, from:item.start, to:item.end });
    }
  };
  try {
    for (const segment of segments) {
      if (!running) return;
      for (;;) {
        if (source.readyState !== "open") throw new Error("MMS 已关闭");
        if (evicted || continuousAhead(audio.buffered, audio.currentTime) < 15) await repair();
        const ahead = continuousAhead(audio.buffered, audio.currentTime) / audio.playbackRate;
        const needsData = !MMS || source.streaming || ahead < 15;
        if (ahead <= aheadCap && needsData) break;
        await waitForNeed();
      }
      const clip = await fetchClip(segment, segmentIndex);
      await trimPlayed();
      await repair();
      const start = tail;
      await append(clip, start);
      tail = bufferedEnd();
      if (tail <= start) throw new Error("追加音频未推进时间轴");
      ledger.push({ index:segmentIndex, start, end:tail, bytes:clip });
      log("appended", { seg:segmentIndex, from:start, to:tail, streaming:source.streaming });
      segmentIndex++;
    }
    // 保持媒体源打开直到缓冲播完，期间仍可恢复被 MMS 回收的未来内容。
    while (running && audio.currentTime < tail - 0.15) { await repair(); await waitForNeed(); }
    if (source.readyState === "open") { source.endOfStream(); log("end-of-stream"); }
  } finally {
    audio.removeEventListener("timeupdate", wake);
    document.removeEventListener("visibilitychange", wake);
    URL.revokeObjectURL(sourceUrl);
  }
}

// ---------- 方式二：逐段换源（对照组，模拟现在的播放器） ----------
async function runSwap(segments) {
  const iterator = segments[Symbol.iterator]();
  let pending = null;
  let currentUrl = "";
  const silence = silentClip();
  const prefetch = () => {
    const next = iterator.next();
    if (next.done) { pending = null; return; }
    const entry = { index:segmentIndex++, clip:null, promise:null };
    entry.promise = fetchClip(next.value, entry.index).then(clip => { entry.clip = clip; return entry; });
    entry.promise.catch(() => undefined);
    pending = entry;
  };
  const playClip = ({ index, clip }) => {
    const previous = currentUrl;
    currentUrl = URL.createObjectURL(new Blob([clip], { type:"audio/mpeg" }));
    audio.loop = false;
    audio.src = currentUrl;
    if (previous) URL.revokeObjectURL(previous);
    audio.playbackRate = Number($("rate").value);
    log("swap-src", { seg:index });
    audio.play().then(() => log("play-ok", { seg:index })).catch(e => log("play-reject", { seg:index, message:String(e) }));
    playedSegments++;
    prefetch();
  };
  const nextClip = () => {
    if (!running) return;
    const next = pending;
    if (!next) { log("finished"); running = false; return; }
    // 与正式播放器一致：命中缓存时同步换源，不经过 await。
    if (next.clip) { log("cache-hit", {seg:next.index}); playClip(next); return; }
    log("next-not-ready", {seg:next.index});
    audio.loop = true;
    audio.src = silence;
    audio.play().catch(e => log("silent-play-reject", {message:String(e)}));
    next.promise.then(entry => { if (running) playClip(entry); }).catch(e => {
      running = false;
      audio.pause();
      log("run-fail", {message:String(e)});
    });
  };
  audio.onended = nextClip;
  prefetch();
  nextClip();
}

/** 1 秒静音 WAV。 */
function silentClip() {
  const rate = 8000;
  const bytes = new DataView(new ArrayBuffer(44 + rate * 2));
  const text = (offset, value) => [...value].forEach((ch, i) => bytes.setUint8(offset + i, ch.charCodeAt(0)));
  text(0, "RIFF"); bytes.setUint32(4, 36 + rate * 2, true); text(8, "WAVEfmt ");
  bytes.setUint32(16, 16, true); bytes.setUint16(20, 1, true); bytes.setUint16(22, 1, true);
  bytes.setUint32(24, rate, true); bytes.setUint32(28, rate * 2, true); bytes.setUint16(32, 2, true);
  bytes.setUint16(34, 16, true); text(36, "data"); bytes.setUint32(40, rate * 2, true);
  return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
}

let streamSession = null;
let streamRevision = 0;
let clickedAt = 0;
let audibleLogged = false;
async function prepareStreamSession() {
  const revision = ++streamRevision;
  streamSession = null;
  if ($("mode").value !== "stream" || !chapters.length || running) return;
  $("start").disabled = true;
  $("status").textContent = "正在连接听书服务…";
  let text = "";
  for (const segment of segmentsFrom(Number($("chapter").value), 600)) {
    text += segment.text;
    if (text.length >= 22000) break;
  }
  text = text.slice(0, 22000);
  if (/[\uD800-\uDBFF]$/.test(text)) text = text.slice(0, -1);
  try {
    const response = await fetch("/api/sync/audio-stream/session", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, seconds: Number($("minutes").value) * 60 * Number($("rate").value) }),
      signal: AbortSignal.timeout(15000),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    if (revision !== streamRevision) return;
    streamSession = data;
    $("start").disabled = false;
    $("status").textContent = "可以播放。首句正在预热，点击开始无需等待后文生成。";
    log("stream-session-ready", { chars: data.chars });
  } catch (error) {
    if (revision !== streamRevision) return;
    $("status").textContent = String(error) + "。登录后重新打开测试页或重新选择章节。";
    log("stream-session-fail", { message: String(error) });
  }
}
for (const id of ["chapter", "mode", "minutes", "rate"]) $(id).addEventListener("change", () => {
  if ($("mode").value !== "stream") $("start").disabled = false;
  prepareStreamSession();
});
async function readStreamMetrics() {
  if (!streamSession) return;
  try {
    const response = await fetch(`/api/sync/audio-stream/${streamSession.id}.json`);
    if (!response.ok) return;
    const metrics = await response.json();
    log("stream-server", metrics);
  } catch (error) { log("stream-metrics-fail", { message: String(error) }); }
}
function runStream() {
  if (!streamSession) throw new Error("听书服务尚未连接，请重新选择章节");
  clickedAt = performance.now(); audibleLogged = false;
  audio.src = streamSession.url;
  audio.playbackRate = Number($("rate").value);
  log("stream-play-request");
  // Called synchronously from the start click: keep Safari's user activation.
  return audio.play();
}
audio.addEventListener("playing", () => {
  if ($("mode").value !== "stream" || audibleLogged) return;
  audibleLogged = true;
  const elapsed = Math.round(performance.now() - clickedAt);
  log("stream-first-playing", { ms: elapsed });
  $("status").textContent = `点击到播放器开始播放：${elapsed} 毫秒。后文由服务端继续生成，可锁屏测试。`;
  // Diagnostics only: this request does not supply or schedule audio.
  setTimeout(readStreamMetrics, 1500);
});
audio.addEventListener("error", () => {
  if ($("mode").value !== "stream") return;
  $("status").textContent = `音频流中断（${audio.error?.code || "未知"}），请复制日志。`;
  readStreamMetrics();
});
audio.addEventListener("ended", () => {
  if ($("mode").value !== "stream") return;
  $("status").textContent = "本次流式测试结束，请复制日志。";
  readStreamMetrics();
});

async function hlsRequest(action, body) {
  let lastError;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const response = await fetch("/api/sync/hls/" + action, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify(body), signal: AbortSignal.timeout(90000),
      });
      const data = await response.json();
      if (!response.ok) {
        const error = new Error(data.error || `HTTP ${response.status}`);
        if (response.status < 500) { error.permanent = true; throw error; }
        throw error;
      }
      return data;
    } catch (error) {
      if (error.permanent) throw error;
      lastError = error;
      log("hls-prepare-retry", { action, attempt, message: String(error) });
    }
  }
  throw lastError;
}
async function runHls() {
  $("toggle").disabled = true;
  const ids = [];
  let duration = 0;
  const target = Number($("minutes").value) * 60 * Number($("rate").value);
  // Hard splitting also handles a single unusually long sentence.
  outer: for (const segment of segmentsFrom(Number($("chapter").value), 600)) {
    const chars = Array.from(segment.text);
    while (chars.length) {
      let text = "";
      while (chars.length && text.length + chars[0].length <= 600) text += chars.shift();
      $("status").textContent = `正在准备第 ${ids.length + 1} 批，已完成 ${(duration / 60 / Number($("rate").value)).toFixed(1)} 分钟。请保持前台，准备完成后再锁屏。`;
      const clip = await hlsRequest("prepare", { text });
      ids.push(clip.id); duration += clip.duration;
      log("hls-prepared", { batch: ids.length, duration, chapter: segment.chapter });
      if (duration >= target || ids.length >= 40) break outer;
    }
  }
  if (!ids.length) throw new Error("没有可朗读的文字");
  const result = await hlsRequest("finish", { ids });
  const playbackMinutes = result.duration / 60 / Number($("rate").value);
  $("status").textContent = `已准备 ${playbackMinutes.toFixed(1)} 分钟${duration < target ? "（已到书末或批次上限）" : ""}。点击下方播放后可锁屏；播放期间无需本页继续生成音频。`;
  log("hls-ready", { duration: result.duration, batches: ids.length });
  const button = $("hls-play");
  button.hidden = false;
  button.onclick = () => {
    audio.src = result.url;
    audio.playbackRate = Number($("rate").value);
    audio.play().then(() => {
      button.hidden = true; $("toggle").disabled = false;
      log("hls-play-ok");
    }).catch(error => log("hls-play-reject", { message: String(error) }));
  };
}

async function start() {
  if (!chapters.length) { alert("先选一本书"); return; }
  if ($("mode").value === "mms" && (!Source || !Source.isTypeSupported("audio/mpeg"))) {
    alert("这台设备的 MMS 不支持 audio/mpeg，MMS 方式跑不了");
    return;
  }
  if ($("mode").value === "hls" && !audio.canPlayType("application/vnd.apple.mpegurl")) {
    alert("当前浏览器不支持原生 HLS，请在 iPhone Safari 或主屏幕 PWA 中测试"); return;
  }
  if (navigator.audioSession) navigator.audioSession.type = "playback";
  for (const id of ["book", "chapter", "mode", "size", "ahead", "rate", "minutes"]) $(id).disabled = true;
  running = true;
  startedAt = Date.now();
  $("start").disabled = true;
  $("toggle").disabled = false;
  const book = books.find((b) => b.id === $("book").value);
  log("start", { mode: $("mode").value, book: book && book.title, chapter: Number($("chapter").value), size: Number($("size").value), aheadTarget: Number($("ahead").value), rate: Number($("rate").value), standalone: matchMedia("(display-mode: standalone)").matches });
  setupMediaSession(book ? book.title : "测试");
  const segments = segmentsFrom(Number($("chapter").value), Number($("size").value));
  try {
    if ($("mode").value === "stream") await runStream();
    else if ($("mode").value === "hls") await runHls();
    else if ($("mode").value === "mms") await runMms(segments);
    else await runSwap(segments);
  } catch (error) {
    running = false;
    audio.pause();
    log("run-fail", { message: String(error) });
    $("status").textContent = "测试中止：" + String(error) + "。请复制日志，重新打开测试页重试。";
  }
}

// iOS 只认手势里同步发出的 play()：start() 到第一个 await 之前都还在这次点击里，
// MMS / 换源模式同步播放；HLS 准备完成后通过第二次点击播放。
$("start").addEventListener("click", () => { start(); });
$("toggle").addEventListener("click", () => {
  if (audio.paused) {
    audio.play().catch((e) => log("play-reject", { message: String(e) }));
    $("toggle").textContent = "暂停";
  } else {
    audio.pause();
    $("toggle").textContent = "继续";
  }
});
$("copy").addEventListener("click", async () => {
  const text = [caps.join("\n"), "", ...entries.map(formatEntry)].join("\n");
  try {
    await navigator.clipboard.writeText(text);
    alert(`已复制 ${entries.length} 条日志`);
  } catch {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    alert("已复制");
  }
});
$("clear").addEventListener("click", () => {
  entries = [];
  localStorage.removeItem(LOG_KEY);
  renderLog();
});
renderLog();
</script>
</body>
</html>
